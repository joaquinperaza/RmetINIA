on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # Linux-only by default, so this costs nothing on a free account whether the
    # repository is public (Actions minutes are unlimited for public repos) or
    # private (the free tier gives 2,000 minutes/month, and Linux is the 1x
    # runner; macOS bills at 10x and Windows at 2x).
    #
    # If the repository is public, or you have minutes to spare, uncomment the
    # macOS and Windows rows below — this package is pure R, so cross-platform
    # differences are limited to encoding and path handling, but those are worth
    # covering given the accented Spanish text it handles.
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          # - {os: macos-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The live tests hit a free public service run by INIA. They stay off in
      # CI on purpose: see live-catalogue-check.yaml for the one scheduled job
      # that is allowed to talk to it.
      RMETINIA_LIVE_TESTS: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
