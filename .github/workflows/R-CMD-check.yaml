on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # One job: current R on Linux, the 1x-billed runner. Kept deliberately small
    # so it is free on a public repository and barely dents the free tier's
    # 2,000 minutes/month on a private one.
    #
    # Each extra row below is one more parallel job. Uncomment as needed:
    #   oldrel-1  catches use of features too new for people on the previous R
    #   devel     warns before a new R release breaks the package
    #   macos     / windows  cover encoding and path handling, which matter here
    #             because of the accented Spanish text — but they bill at 10x
    #             and 2x respectively on private repos.
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          # - {os: ubuntu-latest,  r: 'oldrel-1'}
          # - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          # - {os: macos-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The live tests hit a free public service run by INIA. They stay off in
      # CI on purpose: see live-catalogue-check.yaml for the one scheduled job
      # that is allowed to talk to it.
      RMETINIA_LIVE_TESTS: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
